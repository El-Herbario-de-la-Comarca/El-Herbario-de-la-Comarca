# Regenera cada dia las tarjetas para compartir fichas (carpeta f/) a partir de Supabase.
# Tambien se puede lanzar a mano: pestaña Actions → «Tarjetas para compartir» → Run workflow.
name: Tarjetas para compartir
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tarjetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generar tarjetas
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 herramientas/generar_tarjetas.py
      - name: Guardar cambios
        run: |
          git config user.name "Herbario (automático)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Tarjetas para compartir al día" && git push; fi
