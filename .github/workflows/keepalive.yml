# Mantiene despierto el proyecto de Supabase (el plan gratuito lo pausa tras 7 dias sin actividad).
# Cada 2 dias hace una consulta minima a la tabla de tabacos con la clave publica de config.js.
# Si Supabase no responde con 200, el workflow falla y GitHub avisa por correo.
# Tambien se puede lanzar a mano: pestaña Actions → «Mantener Supabase activo» → Run workflow.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "41 6 */2 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consulta a Supabase
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' config.js)
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/tabacos?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: $CODIGO"
          test "$CODIGO" = "200"
